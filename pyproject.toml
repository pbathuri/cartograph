[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name (the import module stays `cartograph` and the CLI stays `carto`).
name = "cartograph__v1"
version = "2.0.2"
description = "Local knowledge graph + shared memory for AI agents: PDFs, Office, notebooks and code with page/line citations, over MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Cartograph contributors" }]
keywords = ["rag", "knowledge-graph", "graphrag", "retrieval", "mcp", "mcp-server", "ai-agents", "agent-memory", "memory",
            "embeddings", "local-first", "citations", "pdf", "claude", "cursor", "codex", "second-brain"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

# Core deps are intentionally tiny: a fully-working graph + FTS + viz + MCP with ZERO heavy ML.
# Semantic search, embeddings, and training are opt-in extras so the base install is instant.
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Semantic retrieval (GPU-accelerated if torch sees CUDA, else CPU). ~2GB download.
# einops is required by the default nomic embedding model's remote code.
# transformers 5.17 removed get_extended_attention_mask, which the nomic-embed model's remote code calls.
semantic = ["sentence-transformers>=2.6", "transformers<5.17", "numpy>=1.24", "einops>=0.7"]
# Graph ML: train your own link-prediction / recommendation models on YOUR graph.
ml = ["torch>=2.0", "scikit-learn>=1.3", "numpy>=1.24"]
# Real-time vision: screen capture + OCR feeding the graph (also needs the Tesseract binary on PATH).
vision = ["mss>=9.0", "pillow>=10.0", "pytesseract>=0.3.10"]
# At-rest encryption for sensitive data (e.g. screen captures) + secure local surfaces.
secure = ["cryptography>=42.0"]
# PDF ingestion with page citations (Office/EPUB/HTML need nothing extra). pymupdf is faster + enables OCR.
docs = ["pypdf>=4.0"]
# Everything.
full = ["pypdf>=4.0", "sentence-transformers>=2.6", "transformers<5.17", "torch>=2.0", "scikit-learn>=1.3", "numpy>=1.24", "einops>=0.7",
        "mss>=9.0", "pillow>=10.0", "pytesseract>=0.3.10", "cryptography>=42.0"]
dev = ["pytest>=7", "numpy>=1.24", "ruff>=0.6", "pypdf>=4.0"]  # numpy: learned-model tests; pypdf: PDF tests

[project.scripts]
carto = "cartograph.cli:app"
# Same CLI under the PyPI name, so `uvx cartograph__v1 mcp-server` (how MCP Registry clients launch it) resolves.
cartograph__v1 = "cartograph.cli:app"

[project.urls]
Homepage = "https://github.com/pbathuri/cartograph"
Documentation = "https://github.com/pbathuri/cartograph#readme"
Changelog = "https://github.com/pbathuri/cartograph/blob/main/CHANGELOG.md"
Issues = "https://github.com/pbathuri/cartograph/issues"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pin the classic default rule set: newer ruff releases widened their defaults and CI installs latest.
select = ["E4", "E7", "E9", "F"]
# E402 in cli.py is intentional: stdout/stderr must be reconfigured to UTF-8 (Windows) before other imports.
per-file-ignores = { "cartograph/cli.py" = ["E402"] }

[tool.setuptools.packages.find]
include = ["cartograph*"]

[tool.setuptools.package-data]
"cartograph.viz" = ["*.html", "*.png", "*.svg"]
